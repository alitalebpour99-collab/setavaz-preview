name: check
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium webkit
      - name: Check every page in Chromium and WebKit
        run: node tests/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picks
          path: out/picks
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: out/report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: out/shots
          retention-days: 5
